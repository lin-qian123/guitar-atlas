[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guitar-atlas"
version = "0.2.0"
requires-python = ">=3.12"
description = "Guitar Atlas (六弦漫行): a source-attributed guitar score catalog and local offline library"
dependencies = ["pypdf>=6.8,<7", "beautifulsoup4>=4.12,<5", "requests>=2.32,<3"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.pytest.ini_options]
pythonpath = ["scripts", "."]
testpaths = ["tests"]
